[project]
name = "vluoi-backend-fastapi"
version = "0.1.0"
description = "FastAPI backend for the VLuoi hackathon app"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "langgraph>=1.0.8",
  "pydantic-settings>=2.10.0",
  "python-pptx>=1.0.2",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
